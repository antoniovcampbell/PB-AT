spring.application.name=${SPRING_APPLICATION_NAME:avaliacoes}

server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:avaliacaodb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:antonio}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:antonio}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}

spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.direct.auto-startup=true
app.rabbitmq.listener.auto-startup=true

# Observabilidade: health/readiness, metricas Prometheus e traces OTLP.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}
