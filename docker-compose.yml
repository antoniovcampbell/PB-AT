name: pb-at

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: antonio
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antonio -d catalogo"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: antonio
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  catalogo:
    build:
      context: .
      dockerfile: Dockerfile.catalogo
    environment:
      SPRING_APPLICATION_NAME: catalogo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogo
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: antonio
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: antonio
      SPRING_RABBITMQ_PASSWORD: admin123
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      APP_AUTH_SECRET: pb-at-demo-secret-change-in-production
      APP_DEMO_SEED: "true"
      APP_INTERNAL_SECRET: pb-at-internal-secret
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8090:8090"

  avaliacoes:
    build:
      context: .
      dockerfile: Dockerfile.avaliacoes
    environment:
      SPRING_APPLICATION_NAME: avaliacoes
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/avaliacoes
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: antonio
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: antonio
      SPRING_RABBITMQ_PASSWORD: admin123
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      APP_AUTH_SECRET: pb-at-demo-secret-change-in-production
      APP_CATALOGO_URL: http://catalogo:8090
      APP_DEMO_SEED: "true"
      APP_INTERNAL_SECRET: pb-at-internal-secret
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - catalogo
      - avaliacoes
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  loki:
    image: grafana/loki:3.5.12
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.5.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
